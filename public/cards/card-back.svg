<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 485" role="img" aria-label="Noctis Tarot card back">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#1d1512"/>
      <stop offset="1" stop-color="#090706"/>
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="38%" r="70%">
      <stop offset="0" stop-color="#f6e2bf"/>
      <stop offset="0.6" stop-color="#d9b385"/>
      <stop offset="1" stop-color="#a77d52"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecd395"/>
      <stop offset="0.5" stop-color="#c9a961"/>
      <stop offset="1" stop-color="#9c7a3c"/>
    </linearGradient>
    <g id="star4">
      <path d="M0,-7 L1.4,-1.4 L7,0 L1.4,1.4 L0,7 L-1.4,1.4 L-7,0 L-1.4,-1.4 Z" fill="#e8cf8f"/>
    </g>
    <g id="corner" fill="none" stroke="url(#gold)" stroke-width="1.4">
      <path d="M0,34 Q0,0 34,0"/>
      <path d="M6,40 Q6,6 40,6" stroke-width="0.8"/>
      <path d="M10,26 Q14,14 26,10" />
      <circle cx="20" cy="20" r="3" fill="#c9a961" stroke="none"/>
      <path d="M2,52 q8,-6 4,-14 M52,2 q-6,8 -14,4" stroke-width="1"/>
    </g>
  </defs>

  <!-- base -->
  <rect x="1" y="1" width="298" height="483" rx="16" fill="url(#bg)" stroke="#6e5530" stroke-width="2"/>
  <rect x="11" y="11" width="278" height="463" rx="9" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
  <rect x="16" y="16" width="268" height="453" rx="6" fill="none" stroke="#c9a961" stroke-opacity="0.45" stroke-width="0.8"/>

  <!-- corners -->
  <use href="#corner" transform="translate(20 20)"/>
  <use href="#corner" transform="translate(280 20) scale(-1 1)"/>
  <use href="#corner" transform="translate(20 465) scale(1 -1)"/>
  <use href="#corner" transform="translate(280 465) scale(-1 -1)"/>

  <!-- scattered stars -->
  <g fill="#e8cf8f">
    <circle cx="62" cy="88" r="1.3"/><circle cx="238" cy="96" r="1.1"/><circle cx="84" cy="150" r="0.9"/>
    <circle cx="222" cy="168" r="1.4"/><circle cx="56" cy="300" r="1.1"/><circle cx="246" cy="318" r="0.9"/>
    <circle cx="78" cy="392" r="1.3"/><circle cx="226" cy="402" r="1.1"/><circle cx="110" cy="72" r="0.8"/>
    <circle cx="196" cy="420" r="0.8"/><circle cx="100" cy="430" r="1"/><circle cx="205" cy="62" r="1"/>
  </g>
  <use href="#star4" transform="translate(70 120) scale(0.6)"/>
  <use href="#star4" transform="translate(232 370) scale(0.6)"/>

  <!-- great ellipse and axis -->
  <g fill="none" stroke="url(#gold)">
    <ellipse cx="150" cy="242.5" rx="118" ry="206" stroke-width="1.6"/>
    <ellipse cx="150" cy="242.5" rx="111" ry="199" stroke-width="0.6" stroke-opacity="0.6"/>
    <line x1="150" y1="30" x2="150" y2="455" stroke="#c9a961" stroke-width="1.2"/>
    <line x1="32" y1="242.5" x2="268" y2="242.5" stroke="#c9a961" stroke-width="1"/>
  </g>
  <g fill="#c9a961">
    <circle cx="32" cy="242.5" r="3"/><circle cx="268" cy="242.5" r="3"/>
  </g>

  <!-- sun rays -->
  <g stroke="#c9a961" stroke-linecap="round" transform="translate(150 242.5)">
    <g id="rays">
      <line x1="0" y1="-50" x2="0" y2="-108" stroke-width="1.3"/>
      <line x1="0" y1="-50" x2="0" y2="-84" stroke-width="0.8" stroke-opacity="0.8" transform="rotate(5)"/>
    </g>
    <use href="#rays" transform="rotate(10)"/><use href="#rays" transform="rotate(20)"/><use href="#rays" transform="rotate(30)"/>
    <use href="#rays" transform="rotate(40)"/><use href="#rays" transform="rotate(50)"/><use href="#rays" transform="rotate(60)"/>
    <use href="#rays" transform="rotate(70)"/><use href="#rays" transform="rotate(80)"/><use href="#rays" transform="rotate(90)"/>
    <use href="#rays" transform="rotate(100)"/><use href="#rays" transform="rotate(110)"/><use href="#rays" transform="rotate(120)"/>
    <use href="#rays" transform="rotate(130)"/><use href="#rays" transform="rotate(140)"/><use href="#rays" transform="rotate(150)"/>
    <use href="#rays" transform="rotate(160)"/><use href="#rays" transform="rotate(170)"/><use href="#rays" transform="rotate(180)"/>
    <use href="#rays" transform="rotate(190)"/><use href="#rays" transform="rotate(200)"/><use href="#rays" transform="rotate(210)"/>
    <use href="#rays" transform="rotate(220)"/><use href="#rays" transform="rotate(230)"/><use href="#rays" transform="rotate(240)"/>
    <use href="#rays" transform="rotate(250)"/><use href="#rays" transform="rotate(260)"/><use href="#rays" transform="rotate(270)"/>
    <use href="#rays" transform="rotate(280)"/><use href="#rays" transform="rotate(290)"/><use href="#rays" transform="rotate(300)"/>
    <use href="#rays" transform="rotate(310)"/><use href="#rays" transform="rotate(320)"/><use href="#rays" transform="rotate(330)"/>
    <use href="#rays" transform="rotate(340)"/><use href="#rays" transform="rotate(350)"/>
  </g>

  <!-- central full moon -->
  <circle cx="150" cy="242.5" r="44" fill="#0b0807" stroke="url(#gold)" stroke-width="1.8"/>
  <circle cx="150" cy="242.5" r="38" fill="none" stroke="#c9a961" stroke-opacity="0.5" stroke-width="0.7"/>
  <circle cx="150" cy="242.5" r="29" fill="url(#moon)"/>
  <g fill="#a77d52" opacity="0.45">
    <circle cx="141" cy="236" r="5"/><circle cx="158" cy="250" r="3.5"/><circle cx="155" cy="232" r="2.2"/><circle cx="143" cy="253" r="2.5"/>
  </g>

  <!-- crescents -->
  <path d="M127,126 A23,23 0 0 0 173,126 A26,20 0 0 1 127,126 Z" fill="url(#gold)"/>
  <path d="M127,358 A23,23 0 0 0 173,358 A26,20 0 0 1 127,358 Z" fill="url(#gold)"/>

  <!-- blade above top crescent -->
  <path d="M150,48 L153.5,62 L152,112 L150,118 L148,112 L146.5,62 Z" fill="url(#gold)"/>
  <rect x="142" y="60" width="16" height="2.4" rx="1.2" fill="#c9a961"/>

  <!-- top & bottom stars -->
  <use href="#star4" transform="translate(150 38) scale(1.1)"/>
  <use href="#star4" transform="translate(150 446) scale(1.1)"/>
  <use href="#star4" transform="translate(150 410) scale(0.7)"/>
</svg>
