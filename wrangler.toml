# Cloudflare configuration.
# Works as a Worker with static assets (npx wrangler deploy builds and uploads everything).
# If the project is a Cloudflare *Pages* project instead, Pages ignores this file and uses
# the dashboard build settings (npm run build -> dist) plus the functions/ folder.
name = "tarot-tea"
main = "worker/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Free AI readings through Cloudflare Workers AI (Claude is used instead when ANTHROPIC_API_KEY is set).
[ai]
binding = "AI"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
